name: Core reproducibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned core environment
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked
      - name: Verify frozen release and synthetic tests
        run: |
          uv run python -B scripts/verify_release.py
          uv run pytest tests -q -p no:cacheprovider
      - name: Audit tracked repository contents
        run: uv run python scripts/audit_repository.py
