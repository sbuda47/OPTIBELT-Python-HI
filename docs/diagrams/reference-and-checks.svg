<svg xmlns="http://www.w3.org/2000/svg" width="960" height="534" viewBox="0 0 960 534" role="img" aria-labelledby="title desc">
<title id="title">Learn healthy behaviour, then check the frozen reference</title><desc id="desc">The time sections are separated; the acquisitions still belong to the same development dataset.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs>
<rect width="960" height="534" rx="12" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="28" y="34" font-size="23" font-weight="700" fill="#0f172a">Learn healthy behaviour, then check the frozen reference</text>
<text x="28" y="58" font-size="14" fill="#475569">The time sections are separated; the acquisitions still belong to the same development dataset.</text>
<rect x="28" y="88" width="280" height="144" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="122" font-size="18" font-weight="700" fill="#0f172a">Healthy recordings</text>
<text x="46" y="153" font-size="16" fill="#334155">Use healthy data only</text>
<text x="46" y="176" font-size="16" fill="#334155">to learn the reference</text>
<text x="46" y="199" font-size="16" fill="#334155">and calibrate its boundary.</text>
<rect x="340" y="88" width="280" height="144" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="358" y="122" font-size="18" font-weight="700" fill="#0f172a">Fit and calibrate</text>
<text x="358" y="153" font-size="16" fill="#334155">Earlier sections: fit.</text>
<text x="358" y="176" font-size="16" fill="#334155">Separate sections: calibrate.</text>
<text x="358" y="199" font-size="16" fill="#334155">Leave gaps between sections.</text>
<rect x="652" y="88" width="280" height="144" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
<text x="670" y="122" font-size="18" font-weight="700" fill="#0f172a">Freeze the reference</text>
<text x="670" y="153" font-size="16" fill="#334155">Save the learned parameters</text>
<text x="670" y="176" font-size="16" fill="#334155">and calibrated boundary.</text>
<text x="670" y="199" font-size="16" fill="#334155">Keep them fixed for checks.</text>
<rect x="28" y="340" width="280" height="144" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="374" font-size="18" font-weight="700" fill="#0f172a">Check sections</text>
<text x="46" y="405" font-size="16" fill="#334155">Later healthy sections</text>
<text x="46" y="428" font-size="16" fill="#334155">and fault check sections</text>
<text x="46" y="451" font-size="16" fill="#334155">provide the evaluation inputs.</text>
<rect x="340" y="340" width="280" height="144" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="358" y="374" font-size="18" font-weight="700" fill="#0f172a">Evaluate the HI</text>
<text x="358" y="405" font-size="16" fill="#334155">Apply the same frozen model</text>
<text x="358" y="428" font-size="16" fill="#334155">and operator alarm policy</text>
<text x="358" y="451" font-size="16" fill="#334155">to the check sections.</text>
<rect x="652" y="340" width="280" height="144" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
<text x="670" y="374" font-size="18" font-weight="700" fill="#0f172a">Compare outcomes</text>
<text x="670" y="405" font-size="16" fill="#334155">Healthy warnings and alarms,</text>
<text x="670" y="428" font-size="16" fill="#334155">fault responses and misses.</text>
<text x="670" y="451" font-size="16" fill="#334155">Retain the full result tables.</text>
<polyline points="308,160 336,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="620,160 648,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="308,412 336,412" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="620,412 648,412" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="792,232 792,282 480,282 480,336" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="514" font-size="15" fill="#475569">Repeating these results checks reproducibility. New acquisitions are needed to test generalization.</text>
</g></svg>