[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "optibelt-hi"
version = "0.1.0"
description = "Python research pipeline for the OPTIBELT multivariate health index"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.4.1", "scipy==1.17.1", "h5py==3.15.1", "PyYAML==6.0.3"]

[project.scripts]
optibelt-hi = "optibelt_hi.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/optibelt_hi"]

